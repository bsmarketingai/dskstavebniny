/* hero banner (HTML) */
.hb{position:relative;color:#fff;background:#002433;overflow:hidden}
.hb-slide{position:relative;min-height:560px;display:flex;align-items:center;background-size:cover;background-position:center;animation:hbIn 500ms ease}
.hb-slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,36,51,0.96) 0%,rgba(0,36,51,0.82) 38%,rgba(0,36,51,0.25) 70%,rgba(0,36,51,0.05) 100%)}

.hb-s1{background-image:url(img/173b4ea3246f5c79b2796e95971a4251.jpg)}
.hb-s2{background-image:url(img/99a244dce189527c35150e6dd4d4015c.jpg);background-position:80% 30%}
.hb-s3{background-image:url(img/e739a22f02f2c4fcd5aaeeb27ef5239e.jpg);background-position:70% 60%}

.hb-chip{display:grid;grid-template-columns:auto auto;align-items:baseline;gap:0 12px;padding:12px 16px;border-radius:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);backdrop-filter:blur(6px)}

.hb-chip-n{grid-column:1 / -1;font:500 12px/16px 'Exo 2',sans-serif;color:#CBD1D9}
.hb-big{position:absolute;right:var(--page-margin);bottom:120px;z-index:1;font:700 clamp(96px,14vw,220px)/1 'Exo 2',sans-serif;color:#fff;letter-spacing:-0.04em;text-shadow:0 8px 40px rgba(0,0,0,0.35);pointer-events:none}
.hb-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.hb-cta{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:6px;background:#fff;color:#005980;text-decoration:none;font:700 17px/20px 'Exo 2',sans-serif}
.hb-cta2{display:inline-flex;align-items:center;height:52px;padding:0 22px;border-radius:6px;border:1px solid rgba(255,255,255,0.5);color:#fff;text-decoration:none;font:700 16px/20px 'Exo 2',sans-serif}

.hb-tab{position:relative;flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;padding:20px 16px 24px 0;border:0;background:transparent;color:#B2E8FF;text-align:left;cursor:pointer;font:600 15px/20px 'Exo 2',sans-serif}

    const D = {"cats": ["Stavebniny", "Kotvení a spojování", "Nářadí", "Stavební chemie", "Barvy a nátěry", "Bydlení a zahrada", "Pracovní oděvy a obuv", "Poukazy", "Výprodej"], "stav": ["Zdící materiály", "Betonové výrobky", "Fasády, maltové směsi", "Tepelné izolace", "Lepenky, hydroizolace", "Hutní materiály", "Suchá stavba", "Stavební fólie", "Střechy", "Stavební řezivo", "Příslušenství fasád", "Kamenné koberce", "Písky, štěrky, kamenivo", "Cement, vápno, sádra", "Keramické obklady, dlažby a sanita", "Dveře, zárubně, zámky a kování", "Okna", "Drátěné ploty", "Komíny, krbová kamna, topidla", "Vnitřní a vnější rozvody", "Podlahové krytiny"], "kids": ["Obkladové pásky", "Fasádní lepidla a stěrky", "Cementové potěry", "Spárovací malty", "Fasádní omítkoviny a mozaiky", "Lité podlahy", "Lepidla na obklady a dlažby", "Omítkové a zdící směsi", "Nivelační hmoty", "Sanace a renovace"]};

      })
    };
  }
}
