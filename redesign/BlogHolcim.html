//www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"></path></svg></span><a href="Blog.html" style="color:#5B646E" style-hover="text-decoration: underline">Tepelné izolace</a><span style="color:#5B646E;display:flex"><svg aria-hidden="true" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"></path></svg></span><span aria-current="page" style="color:#1A1E23">Tepelná izolace Holcim Lite Extra</span></nav><header class="bd-head"><a class="bd-cat" href="Blog.html">Tepelné izolace</a><h1 class="bd-h1">Tepelná izolace Holcim Lite Extra</h1><p class="bd-lead">Top produkt s širokým využitím v šikmých střechách a podkroví – uplatní se ale i ve stropech, podlahách na trámech, stěnách, příčkách a provětrávaných fasádách.</p></header><div class="bd-hero"><img src="img/c7d6e7b3219ae2992cdd1b42b1028e63.jpg" alt="Desky kamenné vlny Holcim Lite Extra" width="567" height="426"></div><div class="bd-cols"><div class="bd-art"><section class="bd-sec" id="o-produktu" aria-labelledby="o-produktu-h"><h2 id="o-produktu-h" class="bd-h2">Nehořlavá kamenná vlna s vyšší objemovou hmotností</h2><p>Holcim Lite Extra je nehořlavá hydrofobizovaná deska z minerální vlny s vyšší objemovou hmotností. Je určená pro lehké obvodové stěny, rámové konstrukce, příčky, šikmé střechy a podkrovní stropy – všude tam, kde izolace nenese hlavní zatížení.</p><p>Vyšší objemová hmotnost zlepšuje tepelnou setrvačnost: zpomaluje prostup tepla a pomáhá v létě chránit podkroví před přehříváním.</p><figure class="bd-fig"><img src="img/961f8e20ec9014dd6fff2d5b62fc5816.jpg" alt="Řez šikmou střechou izolovanou kamennou vlnou: sluneční teplo proniká pomaleji do podkroví" width="864" height="667" loading="lazy"><figcaption>Vyšší objemová hmotnost zpomaluje prostup letního tepla do podkroví.</figcaption></figure><p>Hustší struktura vláken přispívá k pohltivosti zvuku a ke vzduchové neprůzvučnosti – zvlášť v kombinaci s vhodným opláštěním, například akustickou sádrokartonovou nebo cementovláknitou deskou.</p><figure class="bd-fig bh-fig-n"><img src="img/7a487fe030e010f1a9126a015df6aa1d.jpg" alt="Zvuk z reproduktoru tlumený stěnou vyplněnou kamennou vlnou" width="740" height="683" loading="lazy"><figcaption>Hustší vlákna pohlcují zvuk a zlepšují neprůzvučnost příček.</figcaption></figure><p>Hydrofobní úprava omezuje nasákavost vodou při montáži i během užívání a nehořlavost zvyšuje požární bezpečnost lehkých a střešních konstrukcí.</p><p class="bh-sum">Holcim Lite Extra se hodí pro stavby, kde chcete kromě dobré tepelné izolace i vyšší rozměrovou stabilitu, lepší akustiku, vyšší požární bezpečnost a lepší chování při letních tepelných špičkách.</p></section><section class="bd-sec" id="vyhody" aria-labelledby="vyhody-h"><h2 id="vyhody-h" class="bd-h2">Hlavní výhody kamenné vlny</h2><ul class="bh-ben"><li class="bh-b"><img class="bh-bi" src="img/243473006c1a0a767b6f825de5d3120e.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Rozměrová stabilita</span></li><li class="bh-b"><img class="bh-bi" src="img/088bbc413e9c9801bc9a415c89f888b0.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Paropropustnost</span></li><li class="bh-b"><img class="bh-bi" src="img/969a7030972e562acb1dced8b90db924.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Vysoká úroveň tepelné izolace</span></li><li class="bh-b"><img class="bh-bi" src="img/4002655bc15b7eab47f55e162ec66a48.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Dobré akustické vlastnosti</span></li><li class="bh-b"><img class="bh-bi" src="img/34124879f49b80640c646eb105d69886.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Nehořlavost a třída reakce na oheň A1</span></li><li class="bh-b"><img class="bh-bi" src="img/247c5fd15640d08f4b80a0fae7db894f.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Využití v novostavbách i při rekonstrukcích</span></li><li class="bh-b"><img class="bh-bi" src="img/fe5d140624955a4356020ef73d334de4.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Široký sortiment tlouštěk a využití</span></li><li class="bh-b"><img class="bh-bi" src="img/9e153955b0465cbca77d42581641a5c8.jpg" alt="" width="305" height="305" loading="lazy"><span class="bh-bt">Ochrana proti přehřívání budovy v letním období</span></li></ul></section><section class="bd-sec" id="tloustky" aria-labelledby="tloustky-h"><h2 id="tloustky-h" class="bd-h2">Tloušťky a ceny</h2><p>Holcim Lite Extra dodáváme v 15 tloušťkách od 50 do 300 mm. Všechny desky mají rozměr 60 × 120 cm a součinitel tepelné vodivosti λ = 0,035 W/(m·K).</p><div class="bd-tw"><table class="bd-tab bh-tab"><caption>Holcim Lite Extra – přehled tlouštěk</caption><thead><tr><th scope="col">Tloušťka</th><th scope="col">Rozměr</th><th scope="col">λ <span>W/(m·K)</span></th><th scope="col">Bez DPH</th><th scope="col">S DPH</th><th scope="col"><span class="bh-sr">Detail</span></th></tr></thead><tbody><tr><th scope="row">50 mm</th><td>60 × 120 cm</td><td>0,035</td><td>79,20 Kč</td><td><strong>95,83 Kč</strong></td><td class="bh-tc"><a class="bh-tl" href="Detail.html" aria-label="Holcim Lite Extra 50 mm – detail produktu">Detail<svg aria-hidden="true" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"></path><path d="M13 18l6 -6"></path><path d="M13 6l6 6"></path></svg></a></td></tr><tr><th scope="row">60 mm</th><td>60 × 120 cm</td><td>0,035</td><td>95,10 Kč</td><td><strong>115,07 Kč</strong></td><td class="bh-tc"><a class="bh-tl" href="Detail.html" a ="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"></path><path d="M13 18l6 -6"></path><path d="M13 6l6 6"></path></svg></span></div></article></li><li><article class="bl-card"><div class="bl-th"><img src="img/6df7a1a417e848550c177197683c3521.jpg" alt="" loading="lazy" width="567" height="426"></div><div class="bl-body"><span class="bl-cat">Fasády</span><h3 class="bl-t"><a class="bl-a" href="BlogDetail.html">Věřte zateplení - srovnání</a></h3><p class="bl-p">V dnešní době, kdy se stále více zaměřujeme na energetickou efektivitu budov…</p><span class="bl-go" aria-hidden="true">Číst článek<svg aria-hidden="true" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"></path><path d="M13 18l6 -6"></path><path d="M13 6l6 6"></path></svg></span></div></article></li></ul></section></main><section class="fq" aria-labelledby="fq-h"><div class="wrap"><div class="fq-head"><h2 id="fq-h" class="fq-h"><span class="fq-hic" aria-hidden="true"><svg aria-hidden="true" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"></path><path d="M12 17l0 .01"></path><path d="M12 13.5a1.5 1.5 0 0 1 1 -1.5a2.6 2.6 0 1 0 -3 -4"></path></svg></span>Časté dotazy</h2></div><div class="fq-g"><details class="fq-i"><summary class="fq-q"><span>Jak funguje rozvoz materiálu na stavbu?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Materiál vám dovezeme vlastní dopravou – podle objemu nákladním vozem s hydraulickou rukou nebo menším vozem. Termín a cenu dopravy domluvíte s prodejnou, ze které se zboží vydává; při objednávce v e-shopu ji uvidíte v košíku.</p></details><details class="fq-i"><summary class="fq-q"><span>Můžu nakoupit online a vyzvednout si zboží na prodejně?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Ano. V košíku zvolte osobní odběr a vyberte jednu z 9 prodejen. Jakmile bude zboží připravené k vyzvednutí, pošleme vám e-mail nebo SMS.</p></details><details class="fq-i"><summary class="fq-q"><span>Jak dlouho mi rezervované zboží podržíte?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Zboží připravené k vyzvednutí pro vás držíme několik pracovních dní. Přesnou lhůtu najdete v potvrzení objednávky; pokud potřebujete víc času, stačí zavolat na prodejnu.</p></details><details class="fq-i"><summary class="fq-q"><span>Mohu vrátit nepoužitý materiál?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Nepoškozené a nepoužité zboží v původním balení můžete vrátit podle obchodních podmínek. Výjimkou je zboží upravené na zakázku, například namíchané barvy nebo nařezaný materiál.</p></details><details class="fq-i"><summary class="fq-q"><span>Namícháte mi barvu nebo omítku v konkrétním odstínu?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Ano. V míchacím centru namícháme fasádní i interiérové barvy a omítky podle vzorníku nebo podle předlohy, kterou přinesete.</p></details><details class="fq-i"><summary class="fq-q"><span>Pomůžete mi spočítat, kolik materiálu potřebuji?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Rádi. Pošlete nám projekt nebo výměry přes <a href="Poptavka.html">Rychlou poptávku</a> a naši prodejci spočítají spotřebu a připraví vám nabídku.</p></details><details class="fq-i"><summary class="fq-q"><span>Můžu jako firma nakupovat na fakturu?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Smluvním zákazníkům nabízíme nákup na fakturu se splatností a individuální ceny. Ozvěte se obchodnímu zástupci na nejbližší prodejně.</p></details><details class="fq-i"><summary class="fq-q"><span>Pomáháte s vyřízením dotací?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Ano. Poradíme vám s dotačními programy na zateplení a úspory energií a administrativu kolem žádosti za vás vyřídíme.</p></details><details class="fq-i"><summary class="fq-q"><span>Půjčujete nářadí a stroje?</span><svg aria-hidden="true" class="fq-ch" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"></path></svg></summary><p class="fq-a">Na vybraných prodejnách si můžete půjčit nářadí a stroje. Které služby nabízí konkrétní prodejna, najdete v <a href="Kontakty.html">kontaktech</a>.</p></details></div><p class="fq-p">Nenašli jste odpověď? <a href="Kontakty.html">Zavolejte nebo napište</a> na kteroukoli prodejnu.</p></div></section><section class="nl"><div class="wrap"><div class="nl-box"><span class="nl-ic"><svg aria-hidden="true" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10z"></path><path d="M3 7l9 6l9 -6"></path></svg></span><div class="nl-tx"><h2 class="nl-h">Odebírejte náš newsletter</h2><p class="nl-p">Výprodeje, novinky a termíny dotací jednou za 14 dní.</p></div><form class="nl-f" onSubmit="{{nlNoop}}"><div class="nl-row"><label class="nl-in"><span class="nl-sr">E-mail</span><input type="email" placeholder="Váš e-mail" autocomplete="email"></label><button type="submit" class="nl-btn">Přihlásit<svg aria-hidden="true" style="flex:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"></path></svg></button></div><label class="nl-cb"><input type="checkbox"><span>Souhlasím se&nbsp;<a href="#">zpracováním osobních ú
