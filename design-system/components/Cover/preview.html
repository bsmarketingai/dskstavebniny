<!-- @dsCard height=288 -->
<style>
.cv{position:relative;width:960px;height:288px;background:var(--white);overflow:hidden;font-family:var(--font-display)}
.cv svg{position:absolute;left:480px;top:0}
.b5{fill:var(--primary-500)}.n9{fill:var(--primary-800)}.o5{fill:var(--main-500)}.b1{fill:var(--primary-100)}.r6{fill:var(--danger)}
.tk{stroke:var(--primary-800);stroke-width:2}
.r{rx:var(--radius-md)}
.nm{position:absolute;left:40px;bottom:40px;max-width:440px}
.nm h1{margin:0;font-size:72px;line-height:.95;font-weight:700;color:var(--secondary-900)}
.nm p{margin:12px 0 0;font-family:var(--font-body);font-size:14px;color:var(--secondary-600)}
</style>
<div class="cv">
<!-- blocks: primary-500 288x200 slab bleeding top, primary-800 192x96, main-500 96x96, primary-100 192x96, danger 32x32
     arrangement: one tall slab from the top edge with satellites stacked right and below, like stacked pallets
     pattern: masonry bond (literal motif — stavebniny), 48×24 px bricks = 2× space-6, offset every other course
     scales: sides in space-8 (32px) multiples, corners radius-md -->
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
<rect class="b5" x="0" y="-8" width="288" height="200"/>
<rect class="n9 r" x="288" y="0" width="192" height="96"/>
<rect class="o5 r" x="288" y="96" width="96" height="96"/>
<rect class="b1" x="0" y="192" width="192" height="96"/>
<rect class="r6 r" x="384" y="160" width="32" height="32"/>
<g class="tk"><line x1="0" y1="120" x2="288" y2="120"/><line x1="0" y1="120" x2="0" y2="144"/><line x1="48" y1="120" x2="48" y2="144"/><line x1="96" y1="120" x2="96" y2="144"/><line x1="144" y1="120" x2="144" y2="144"/><line x1="192" y1="120" x2="192" y2="144"/><line x1="240" y1="120" x2="240" y2="144"/><line x1="0" y1="144" x2="288" y2="144"/><line x1="24" y1="144" x2="24" y2="168"/><line x1="72" y1="144" x2="72" y2="168"/><line x1="120" y1="144" x2="120" y2="168"/><line x1="168" y1="144" x2="168" y2="168"/><line x1="216" y1="144" x2="216" y2="168"/><line x1="264" y1="144" x2="264" y2="168"/><line x1="0" y1="168" x2="288" y2="168"/><line x1="0" y1="168" x2="0" y2="192"/><line x1="48" y1="168" x2="48" y2="192"/><line x1="96" y1="168" x2="96" y2="192"/><line x1="144" y1="168" x2="144" y2="192"/><line x1="192" y1="168" x2="192" y2="192"/><line x1="240" y1="168" x2="240" y2="192"/><line x1="0" y1="192" x2="288" y2="192"/></g>
</svg>
<div class="nm"><h1>DSK<br>Stavebniny</h1><p>Stavební materiál z 9 prodejen ve 3 krajích — přehledně a s cenou bez DPH.</p></div>
</div>
